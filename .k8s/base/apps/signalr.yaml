apiVersion: v1
kind: Service
metadata:
  name: harmony-signalr
  labels:
    app: signalr
spec:
  selector:
    app: signalr
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalr
  labels:
    app: signalr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: signalr
  template:
    metadata:
      labels:
        app: signalr
    spec:
      containers:
        - name: harmony-signalr
          image: harmony-signalr:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: harmony-common
          env:
            - name: ASPNETCORE_HTTPS_PORT
              value: "7262"
            - name: OTEL_SERVICE_NAME
              value: signalr
            - name: ASPNETCORE_Kestrel__Certificates__Default__Password
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: cert-password }
            - name: BrokerConfiguration__Username
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: rabbitmq-user }
            - name: BrokerConfiguration__Password
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: rabbitmq-password }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: redis-password }
            # SignalR Redis backplane
            - name: RedisConnectionString
              value: harmony-redis:6379,password=$(REDIS_PASSWORD)
          ports:
            - containerPort: 443
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 120
          volumeMounts:
            - name: cert-config-map
              mountPath: /https/harmony.pfx
              subPath: harmony.pfx
      volumes:
        - name: cert-config-map
          configMap:
            name: cert-config-map
