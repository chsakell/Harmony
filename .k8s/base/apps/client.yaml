# Blazor WebAssembly client served by nginx (gatewayUrl in wwwroot/appsettings.json -> https://localhost:7108)
apiVersion: v1
kind: Service
metadata:
  name: harmony-client
  labels:
    app: client
spec:
  type: LoadBalancer
  selector:
    app: client
  ports:
    - name: http
      port: 7096
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels:
    app: client
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: harmony-client
          image: harmony-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
