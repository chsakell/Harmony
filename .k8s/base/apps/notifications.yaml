# Harmony.Notifications - database settings (DatabaseProvider, ConnectionStrings__HarmonyJobsConnection) come from the overlay
apiVersion: v1
kind: Service
metadata:
  name: harmony-notifications
  labels:
    app: notifications
spec:
  selector:
    app: notifications
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels:
    app: notifications
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
        - name: harmony-notifications
          image: harmony-notifications:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: harmony-common
          env:
            - name: ASPNETCORE_HTTPS_PORT
              value: "7121"
            - name: OTEL_SERVICE_NAME
              value: notifications
            - name: ASPNETCORE_Kestrel__Certificates__Default__Password
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: cert-password }
            - name: BrokerConfiguration__Username
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: rabbitmq-user }
            - name: BrokerConfiguration__Password
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: rabbitmq-password }
            - name: AppEndpointConfiguration__HarmonyApiEndpoint
              value: https://harmony-api:443/
            - name: AppEndpointConfiguration__FrontendUrl
              value: http://localhost:7096
          ports:
            - containerPort: 443
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 120
          volumeMounts:
            - name: cert-config-map
              mountPath: /https/harmony.pfx
              subPath: harmony.pfx
      volumes:
        - name: cert-config-map
          configMap:
            name: cert-config-map
