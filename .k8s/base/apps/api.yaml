# Harmony.Api - database settings (DatabaseProvider, ConnectionStrings__HarmonyConnection) come from the overlay
apiVersion: v1
kind: Service
metadata:
  name: harmony-api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: harmony-api
          image: harmony-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: harmony-common
          env:
            - name: ASPNETCORE_HTTPS_PORT
              value: "7097"
            - name: OTEL_SERVICE_NAME
              value: api
            - name: ASPNETCORE_Kestrel__Certificates__Default__Password
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: cert-password }
            - name: BrokerConfiguration__Username
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: rabbitmq-user }
            - name: BrokerConfiguration__Password
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: rabbitmq-password }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: harmony-secrets, key: redis-password }
            - name: CacheProvider
              value: Redis
            - name: RedisConnectionString
              value: harmony-redis:6379,password=$(REDIS_PASSWORD)
            - name: AppEndpointConfiguration__AutomationEndpoint
              value: https://harmony-automations:443/
            - name: AppEndpointConfiguration__SourceControlEndpoint
              value: https://harmony-integrations-sourcecontrol:443/
            - name: AppEndpointConfiguration__FrontendUrl
              value: http://localhost:7096
          ports:
            - containerPort: 443
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 120
          volumeMounts:
            - name: cert-config-map
              mountPath: /https/harmony.pfx
              subPath: harmony.pfx
      volumes:
        - name: cert-config-map
          configMap:
            name: cert-config-map
