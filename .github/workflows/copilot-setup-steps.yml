# Prepares the environment for the GitHub Copilot cloud agent and Copilot code review.
# Must live on the default branch; only steps, permissions, runs-on, services, snapshot and timeout-minutes are honoured.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore

      - name: Restore local tools
        run: if [ -f .config/dotnet-tools.json ]; then dotnet tool restore; fi
